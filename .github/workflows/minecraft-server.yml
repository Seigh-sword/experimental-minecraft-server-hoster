name: Experimental Minecraft Server

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: 'How long to run the server before final save (minutes, max 300)'
        required: false
        default: '120'
        type: string
      save_interval_minutes:
        description: 'How often to archive and upload world (minutes)'
        required: false
        default: '30'
        type: string
      server_version:
        description: 'Minecraft version (e.g. 26.2 or 1.21.4)'
        required: false
        default: '26.2'
        type: string

jobs:
  minecraft-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl openjdk-21-jre-headless screen jq

      - name: Download and setup Purpur server
        run: |
          mkdir -p server
          cd server
          TARGET_VERSION="${{ github.event.inputs.server_version || '26.2' }}"
          
          PURPUR_BUILD=$(curl -s "https://api.purpurmc.org/v2/purpur/$TARGET_VERSION" | jq -r '.builds.all[-1] // empty')
          
          if [ -z "$PURPUR_BUILD" ] || [ "$PURPUR_BUILD" = "null" ]; then
            LATEST_VERSION=$(curl -s "https://api.purpurmc.org/v2/purpur" | jq -r '.versions[-1]')
            PURPUR_BUILD=$(curl -s "https://api.purpurmc.org/v2/purpur/$LATEST_VERSION" | jq -r '.builds.all[-1]')
            TARGET_VERSION="$LATEST_VERSION"
          fi

          curl -o paper.jar "https://api.purpurmc.org/v2/purpur/$TARGET_VERSION/$PURPUR_BUILD/download"
          echo "eula=true" > eula.txt

      - name: Configure server
        run: |
          cat > server/server.properties << 'EOF'
          server-ip=
          server-port=25565
          motd=Experimental Minecraft Server
          max-players=20
          view-distance=8
          spawn-animals=true
          spawn-monsters=true
          spawn-npcs=true
          generate-structures=true
          level-type=default
          difficulty=normal
          gamemode=survival
          hardcore=false
          white-list=false
          enable-command-block=false
          pvp=true
          online-mode=true
          enable-rcon=false
          rcon.password=
          EOF

      - name: Download cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Minecraft server
        run: |
          cd server
          screen -dmS minecraft java -Xmx12G -Xms12G -XX:+UnlockExperimentalVMOptions -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockDiagnosticVMOptions -XX:+DisableExplicitGC -XX:TargetSurvivorRatio=90 -XX:G1NewSizePercent=50 -XX:G1MaxNewSizePercent=80 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1ReservePercent=20 -XX:G1HeapRegionSize=32M -jar paper.jar nogui
          sleep 30

      - name: Verify server started
        run: |
          for i in {1..30}; do
            if screen -list | grep -q minecraft; then
              break
            fi
            sleep 3
          done

      - name: Start Cloudflare tunnel
        run: |
          ./cloudflared tunnel --url tcp://127.0.0.1:25565 > tunnel.log 2>&1 &
          sleep 10

      - name: Extract tunnel URL and show summary
        id: tunnel
        run: |
          for i in {1..20}; do
            if grep -q "trycloudflare.com" tunnel.log; then
              TUNNEL_HOST=$(grep -oP 'trycloudflare\.com:[0-9]+' tunnel.log | head -1)
              if [ -n "$TUNNEL_HOST" ]; then
                echo "tunnel_url=$TUNNEL_HOST" >> $GITHUB_OUTPUT
                echo "=== CLOUDFLARE TUNNEL URL: $TUNNEL_HOST ==="
                break
              fi
            fi
            sleep 3
          done
          echo "=== Minecraft Server Summary ==="
          echo "Tunnel URL: ${{ steps.tunnel.outputs.tunnel_url || 'Not available' }}"

      - name: Archive and upload loop
        id: archive_loop
        run: |
          SAVE_INTERVAL=${{ github.event.inputs.save_interval_minutes || '30' }}
          RUNTIME=${{ github.event.inputs.runtime_minutes || '120' }}
          END_TIME=$(($(date +%s) + RUNTIME * 60))
          SAVE_COUNT=0

          while [ $(date +%s) -lt $END_TIME ]; do
            sleep $((SAVE_INTERVAL * 60))

            if [ $(date +%s) -ge $END_TIME ]; then
              break
            fi

            SAVE_COUNT=$((SAVE_COUNT + 1))
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            if screen -list | grep -q minecraft; then
              screen -S minecraft -p 0 -X stuff "save-all$(printf '\r')"
              sleep 10
            else
              echo "Screen session lost, skipping save"
              continue
            fi

            if [ ! -d "server/world" ] || [ ! "$(ls -A server/world)" ]; then
              continue
            fi

            cd server
            7z a -t7z -mx=5 -r "world-$TIMESTAMP.7z" world/ > /dev/null 2>&1
            cd ..

            SAVE_COUNT=$SAVE_COUNT
          done

          echo "save_count=$SAVE_COUNT" >> $GITHUB_OUTPUT

      - name: Final save and archive
        if: always()
        run: |
          if screen -list | grep -q minecraft; then
            screen -S minecraft -p 0 -X stuff "save-all$(printf '\r')"
            sleep 10
            screen -S minecraft -p 0 -X stuff "stop$(printf '\r')"
            sleep 5
          fi

          if [ -d "server/world" ] && [ "$(ls -A server/world)" ]; then
            cd server
            7z a -t7z -mx=5 -r "world-final.7z" world/ > /dev/null 2>&1
            cd ..
          fi

      - name: Upload world backups artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-world-backups
          path: server/world-*.7z